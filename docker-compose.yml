# ==============================================================================
# docker-compose.yml — Hạ Tầng Docker Di Động cho Dự án web_ban_hang
# Nền tảng: 100% Odoo 19.0 Community (LGPL-3) + PostgreSQL 15
# Di động 100% giữa Windows (Docker Desktop WSL2) và Linux Local Server
# ==============================================================================

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15-bookworm}
    container_name: ${CLIENT_NAME:-web-ban-hang}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - web_ban_hang_pgdata:/var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DB_PORT:-51901}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web_ban_hang_net

  odoo:
    image: ${ODOO_IMAGE:-odoo:19.0}
    container_name: ${CLIENT_NAME:-web-ban-hang}-app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${ODOO_PORT:-1901}:8069"
      - "${LONGPOLLING_PORT:-7089}:8072"
    environment:
      HOST: db
      PORT: "5432"
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./data/filestore:/var/lib/odoo/filestore
      - ./data/sessions:/var/lib/odoo/sessions
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; r = urllib.request.urlopen('http://localhost:8069/web/health', timeout=5); assert r.status == 200\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - web_ban_hang_net

volumes:
  web_ban_hang_pgdata:
    name: "${CLIENT_NAME:-web-ban-hang}_pgdata"

networks:
  web_ban_hang_net:
    name: "${CLIENT_NAME:-web-ban-hang}_net"
    driver: bridge
