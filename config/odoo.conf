# ==============================================================================
# config/odoo.conf — Cấu Hình Odoo 19.0 Community Di Động (web_ban_hang)
# Lưu ý Staging/Production: đặt `list_db = False`, cấu hình `workers` theo CPU,
# và thay `admin_passwd` bằng chuỗi hash PBKDF2 mạnh.
# ==============================================================================

[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
admin_passwd = change_me_odoo_master_password
db_host = db
db_port = 5432
db_user = odoo
dbfilter = ^web_ban_hang.*$
list_db = True
proxy_mode = True
without_demo = all
log_level = info
limit_time_cpu = 120
limit_time_real = 240
